<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Miroir Miroir · Le vrai test psychométrique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <section id="welcome" class="screen active">
    <img class="lettering" src="assets/miroir-noir.png" alt="Miroir Miroir">
    <div class="side">
      <div class="xbox">✕</div>
      <p class="biennale">Biennale<br>de l’image<br>possible<br>2026</p>
      <h1>Le vrai test psychométrique<br><em>The Real Psychometric Test</em></h1>
      <div class="langs">
        <button class="lang" data-lang="fr">Français</button>
        <button class="lang" data-lang="en">English</button>
      </div>
    </div>
    <p class="dates">17.10 – 13.12 / Liège (BE)</p>
  </section>

  <section id="question" class="screen">
    <header>
      <span class="count"></span>
      <div class="dots"></div>
      <button class="xbox restart" aria-label="Recommencer">✕</button>
    </header>
    <h2 class="q"></h2>
    <div class="answers"></div>
  </section>

  <section id="result" class="screen">
    <img class="lettering small" src="assets/miroir-blanc.png" alt="">
    <h2 class="title"></h2>
    <div class="textbox"><p class="text"></p></div>
    <footer>
      <p class="printing"></p>
      <button class="again"></button>
    </footer>
  </section>

</div>

<!-- Étiquette : invisible à l'écran, seule chose imprimée -->
<div id="label">
  <div class="l-head">
    <img src="assets/miroir-noir.png" alt="">
    <div><span class="l-title"></span><br>BIP 2026 · Liège</div>
    <span class="l-x">✕</span>
  </div>
  <div class="l-body"><p class="l-text"></p></div>
</div>

<script src="config.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
