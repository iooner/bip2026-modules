<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Miroir Miroir · Signature corporelle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <section id="welcome" class="screen active">
    <img class="lettering" src="assets/miroir-noir.png" alt="Miroir Miroir">
    <div class="side">
      <div class="xbox">✕</div>
      <p class="biennale">Biennale<br>de l’image<br>possible<br>2026</p>
      <h1>Signature corporelle<br><em>Body signature</em></h1>
      <div class="langs">
        <button class="lang" data-lang="fr">Français</button>
        <button class="lang" data-lang="en">English</button>
      </div>
    </div>
    <p class="dates">17.10 – 13.12 / Liège (BE)</p>
    <p class="credit">Built with <span>♥</span> by iooner @ Liège Hackerspace for BIP26</p>
  </section>

  <section id="place" class="screen">
    <header>
      <span class="step" data-t="stepPlace"></span>
      <button class="xbox restart" aria-label="Recommencer">✕</button>
    </header>
    <h2 data-t="placeTitle"></h2>
    <p class="sub" data-t="placeText"></p>
    <div class="mirror">
      <canvas class="live" width="560" height="420"></canvas>
      <p class="pos"></p>
      <div class="floorx">✕</div>
      <div class="hold"><i></i></div>
    </div>
    <footer>
      <p class="status"></p>
      <button class="go" data-t="go"></button>
    </footer>
  </section>

  <section id="record" class="screen">
    <canvas class="draw" width="1024" height="768"></canvas>
    <canvas class="skel" width="240" height="180"></canvas>
    <p class="hint"></p>
    <div class="count"></div>
    <div class="bar"><i></i></div>
  </section>

  <section id="result" class="screen">
    <img class="lettering small" src="assets/miroir-blanc.png" alt="">
    <h2 class="title" data-t="resultTitle"></h2>
    <div class="row">
      <canvas class="sig" width="584" height="440"></canvas>
      <figure class="replaybox">
        <canvas class="replay" width="296" height="222"></canvas>
        <figcaption data-t="replay"></figcaption>
      </figure>
    </div>
    <p class="meta"></p>
    <footer>
      <p class="printing"></p>
      <div class="actions">
        <button class="done" data-t="done"></button>
      </div>
    </footer>
  </section>

</div>

<div id="learn" hidden></div>

<!-- Étiquette : invisible à l'écran, seule chose imprimée -->
<div id="label">
  <div class="l-head">
    <img src="assets/miroir-noir-gras.png" alt="">
    <div><span class="l-title"></span><br>BIP 2026 · Liège<br><span class="l-credit">× Liège Hackerspace × iooner</span></div>
    <span class="l-x">✕</span>
  </div>
  <div class="l-body"><img class="l-sig" alt=""></div>
  <div class="l-foot"><span class="l-meta"></span></div>
</div>

<script src="config.js"></script>
<script src="status.js"></script>
<script src="tracking.js"></script>
<script src="signature.js"></script>
<script src="app.js"></script>
</body>
</html>
